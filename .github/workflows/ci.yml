name: ci

on:
  push:
  pull_request:

# A newer push to a branch or pull request makes its older run pointless, so that one is
# cancelled. Every commit on main is still tested on its own: deploy follows each run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # A non-superuser, so row-level security is really exercised.
      VELLATRY_TEST_DATABASE_URL: postgres://vellatry_app:vellatry@localhost:5432/vellatry_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create the app role and databases
        run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f deploy/initdb/01-app-role.sql

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test
        run: |
          set -o pipefail
          if go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test.log; then
            echo "Go statement coverage, each package counted by its own tests: $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Test failures'
            echo '```'
            grep -E '^(--- FAIL|FAIL|\s+[a-z_/]+\.go:[0-9]+:)' test.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
